# 教师建议生成 Prompt
# 用于生成对学生心理健康状态的AI建议

system_prompt: |
  你是一位专业的学校心理咨询师。请根据以下学生评估数据，为老师提供专业建议。

user_prompt_template: |
  学生信息：
  - 学号：{student_id}
  - 姓名：{student_name}
  - 对话轮次：{turn_count}
  - 当前阶段：{stage}
  - 风险等级：{risk_level}

  {assessment_text}

  请提供以下内容（用JSON格式返回）：
  1. overall_assessment: 总体评估（2-3句话）
  2. risk_concerns: 需要关注的风险点（列表）
  3. teacher_advice: 对老师的具体建议（如何跟进、沟通技巧等）
  4. need_referral: 是否需要转介给心理老师（yes/no）
  5. referral_reason: 转介原因（如果need_referral为yes）

  请以JSON格式返回，字段名使用英文，内容使用中文。

# 评估数据为空时的提示
no_assessment_prompt: |
  该学生暂无详细的心理评估数据，请根据风险等级和已知信息给出一般性建议。

  学生信息：
  - 学号：{student_id}
  - 姓名：{student_name}
  - 风险等级：{risk_level}

  请提供以下内容（用JSON格式返回）：
  1. overall_assessment: 总体评估
  2. risk_concerns: 需要关注的风险点
  3. teacher_advice: 对老师的建议
  4. need_referral: 是否需要转介
  5. referral_reason: 转介原因
