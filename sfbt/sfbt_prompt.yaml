methods:
  例外情境:
    core_task: 发现并放大问题未发生或减弱时的有效资源，使其可被复制与扩展
    steps:
      引出:
        purpose: 确认例外存在
        example: |
          "你提到昨天下午好像稍微好了一点点，那是个什么样的瞬间？哪怕只有几分钟也可以。"
          （必须使用用户提到的例外）

      放大:
        purpose: 放大，将模糊的好一点转化为具体可观察
        example: |
          "在那一刻，你发现自己和往常有什么不同？"
          "如果你周围的人在场，他们会发现你有什么不一样的表现？"

      强化:
        purpose: 将例外归功于用户的努力或选择
        example: |
          "听起来你其实是可以让自己慢下来的。"
          "你已经有调节情绪的能力。"
          "那天你表现得很有自控力。"

      重新开始:
        purpose: 让例外变成趋势
        example: |
          "如果下周再试一次，你会怎么做？"
          "怎样让这种情况多出现一点？"
          "要让这种状态从1次变成2次，需要什么？"

  奇迹问题:
    core_task: 暂时移除当前问题，帮助用户构建问题解决后的未来图景，并将其连接到现实中的可行性资源
    steps:
      构建奇迹:
        purpose: 让用户进入"问题已解决"的未来视角
        example: |
          "如果今晚你睡得很踏实，等明天醒来的时候，你发现那些让你心烦的事暂时退后了一点点（此处应当是假设用户的问题好转），不再占据你全部的注意。你睁开眼的第一感觉，会有什么细微的变化？"

      具体化与扩展:
        purpose: 将用户描述的理想状态从抽象愿望转化为具体、可观察、可体验的现实细节
        example: |
          "如果那时候你走在路上，一个很久没见但很了解你的朋友迎面走来，他可能会从你的眼神或步态里，察觉到你有什么不一样的气色吗？"
          "当你带着这种'稍微好一点'的状态去和家人说话，你猜他们会给出一个什么样的意外反应？"（应当结合用户实际情况）

  应对问题:
    core_task: 帮助来访者意识到自己已经在某种程度上"撑住了"，从而发现其隐含的应对资源与能力
    steps:
      应对问题本体:
        purpose: 帮助来访者意识到自己已经在使用某些应对方式
        example: |
          "听起来这段时间真的很难，但你还是一直在坚持上课和生活。你觉得自己是怎么做到没有完全放弃的？"
          "在这么多压力下，你依然在努力面对这些事情。通常在最难的时候，你会做些什么让自己撑过去？"
          "即使情况这么困难，你也没有完全停下来。你觉得自己是靠什么撑到现在的？"

      具体化:
        purpose: 帮助用户将其应对方式转化为具体行为或策略
        example: |
          "那通常是怎么发生的？"
          "那种时候你一般会做点什么？"
          "那会不会稍微帮你缓一口气？"

      发现与放大:
        purpose: 把用户行为重新框定为资源或能力
        example: |
          "所以在特别难的时候，你会找点事情转移一下注意力，让自己缓一缓。"
          "听起来你其实挺会给自己一点喘气空间。"
          "在这么困难的时候还能找到方式让自己撑住，这其实不容易。"

  量尺问题:
    core_task: 通过量化当前状态，引导来访者发现自己已经在发挥的资源与努力，并找到能够让情况向前推进的一小步改变
    steps:
      给出量尺:
        purpose: 用一个清晰的 0-10 量表，让来访者把模糊的感受具体化
        example: |
          "如果用 0 到 10 来表示你现在面对这个问题时的状态：0 代表情况最糟、完全撑不住，10 代表问题已经完全解决、你非常满意现在的状态。那你觉得你现在大概在几分的位置？"

      探索原因:
        purpose: 引导来访者解释为什么不是更低的分数，从而自然挖掘资源
        example: |
          "你刚刚说是4分。为什么不是2分或者3分呢？是什么让你还能维持在4分这个位置？"

      探索进步:
        purpose: 把注意力转向可实现的小进步，寻找提升空间
        example: |
          "如果从4分变成5分，对你来说会发生什么不一样的事情？"
          "或者说，什么样的一点点变化会让你觉得自己往上走了一格？"

  关系问题:
    借用“重要他人”的视角，将抽象的改变转化为具体、可观察的行为迹象。
    要点：1. 识别谁是首先注意到改变的观察者；2. 描述对方能看到的具体动作、神态或话语；3. 探讨这种改变如何引发双方互动方式的正面连锁反应。

  赞美:
    基于事实肯定用户的资源、能力和努力，增强其自我效能感和积极情绪。
    要点：1.事实化：具体描述观察到的积极行为，不进行抽象的空洞夸奖。2.赋能化：加入“你是如何做到的？”或“这体现了你哪种看重的品质？”等引导式提问。3.非评价性：以“好奇的观察者”而非“高位的评判者”身份表达，将成功归因于对方。

  跟随对话:
    core_task: 跟随用户的话题进行正常对话，不刻意使用 SFBT 技术
    steps:
      默认:
        purpose: 保持自然聊天，等待合适的干预时机
        example: |
          "跟随用户的话题"
          "保持自然聊天"
          "如果用户情绪低落，适当共情"
          "等待合适的干预时机"
        warning: |
          "不要强行使用 SFBT 技术"
          "不要追问太多轮"
        evaluation: "允许对事件/处境/外界做价值判断，明确站在用户一边，禁止对用户本人做判断、定性或标签化"

transition_notice: |
  重要提示：上一轮使用了奇迹问题的"具体化与扩展"，这是奇迹问题的最后一步。
  本轮需要在保持奇迹愿景的同时，自然过渡到其他干预方法。
  请根据对话内容选择最合适的下一轮方法：
  - 如果用户开始描述具体场景，优先使用量尺问题
  - 如果用户提到过去的成功经验，优先使用例外情境
  - 如果用户表达困难情绪，优先使用应对问题
